[project]
name = "sourcecraft-mcp"
version = "0.1.0"
description = "MCP сервер для анализа и навигации по исходному коду"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pysourcecraft",
    "mcp>=1.26.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcecraft_mcp"]

[tool.uv.sources]
pysourcecraft = { git = "https://git.sourcecraft.dev/ram56/pysourcecraft.git", rev = "v0.1.0" }

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.6.0",
    "ty>=0.0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[project.scripts]
sourcecraft-mcp = "sourcecraft_mcp.server:main"
sourcecraft = "sourcecraft_mcp.cli.app:main"
